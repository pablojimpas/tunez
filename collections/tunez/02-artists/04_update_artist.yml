info:
  name: Update Artist
  type: http
  seq: 6
  tags:
    - music
    - artist
    - json-api
http:
  method: PATCH
  url: "{{base_url}}/api/json/artists/{{artist_id}}"
  headers:
    - name: Accept
      value: application/vnd.api+json
    - name: Content-Type
      value: application/vnd.api+json
  body:
    type: json
    data: |-
      {
        "data": {
          "attributes": {
            "biography": "Iconic British rock band formed in London in 1970.",
            "name": "Queen"
          },
          "id": "{{artist_id}}",
          "type": "artist"
        }
      }
  auth:
    type: bearer
    token: "{{token}}"
runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.data.id
      operator: eq
      value: "{{artist_id}}"
