info:
  name: Search Artists
  type: http
  seq: 4
  tags:
    - music
    - artist
    - json-api
http:
  method: GET
  url: "{{base_url}}/api/json/artists"
  headers:
    - name: Accept
      value: application/vnd.api+json
  params:
    - name: query
      value: Queen
      type: query
runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.data
      operator: isArray
