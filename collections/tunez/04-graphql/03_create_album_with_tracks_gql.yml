info:
  name: Create Album with Tracks (GraphQL)
  type: graphql
  seq: 13
  tags:
    - music
    - album
    - track
    - graphql
graphql:
  url: "{{base_url}}/gql"
  headers:
    - name: Content-Type
      value: application/json
  body:
    query: |
      mutation CreateAlbum($input: CreateAlbumInput!) {
        createAlbum(input: $input) {
          result {
            id
            name
            yearReleased
            tracks {
              id
              number
              name
              duration
            }
          }
          errors {
            message
          }
        }
      }
    variables: |-
      {
        "input": {
          "artistId": "{{gql_artist_id}}",
          "name": "The Dark Side of the Moon",
          "tracks": [
            {
              "duration": "01:30",
              "name": "Speak to Me",
              "order": 0
            },
            {
              "duration": "02:43",
              "name": "Breathe",
              "order": 1
            }
          ],
          "yearReleased": 1973
        }
      }
  auth:
    type: bearer
    token: "{{token}}"
runtime:
  actions:
    - type: set-variable
      phase: after-response
      selector:
        expression: res.body.data.createAlbum.result.id
        method: jsonq
      variable:
        name: gql_album_id
        scope: runtime
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.data.createAlbum.result.id
      operator: isDefined
    - expression: res.body.data.createAlbum.errors
      operator: isEmpty
